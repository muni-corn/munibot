[package]
name = "munibot_config_derive"
description = "derive macros for munibot_config: Configurable and ConfigChoice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
# feature = "derive" (not munibot_config_derive directly): tests exercise
# the derives the way real consumers will, through munibot_config's own
# re-export, so this is also what proves that re-export actually works.
munibot_config = { path = "../munibot_config", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
