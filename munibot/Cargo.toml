[package]
name = "munibot"
description = "the universe's most lovable bot, personality included"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true


[dev-dependencies]
rand_chacha = "0.3"
tempfile = "3.27.0"

[dependencies]
# always required: dioxus itself, and its wasm-target transitive dep that
# needs the `js` feature explicitly activated for the web build
dioxus.workspace = true
dioxus-html.workspace = true
getrandom.workspace = true

# the rpc boundary: wire dtos and server functions, needed on both targets
# (the client calls the generated stubs; the server runs the bodies) -- its
# own web/server features are forwarded below
munibot_api = { path = "../munibot_api", default-features = false }

# server-only deps, enabled by the `server` feature. these pull in the bots,
# native networking, and everything that can't compile for wasm32
munibot_core = { path = "../munibot_core", optional = true }
munibot_discord = { path = "../munibot_discord", optional = true }
munibot_twitch = { path = "../munibot_twitch", optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum_session = { workspace = true, optional = true }
axum_session_auth = { workspace = true, optional = true }
axum_session_redispool = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
redis_pool = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
reqwest = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "munibot_api/web"]
server = [
  "dioxus/server",
  "munibot_api/server",
  "dep:munibot_core",
  "dep:munibot_discord",
  "dep:munibot_twitch",
  "dep:clap",
  "dep:dotenvy",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:anyhow",
  "dep:axum",
  "dep:async-trait",
  "dep:axum_session",
  "dep:axum_session_auth",
  "dep:axum_session_redispool",
  "dep:redis",
  "dep:redis_pool",
  "dep:diesel",
  "dep:reqwest",
  "dep:chrono",
]
