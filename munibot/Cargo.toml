[package]
name = "munibot"
description = "the universe's most lovable bot, personality included"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true


[dev-dependencies]
rand_chacha = "0.3"
tempfile = "3.27.0"

[dependencies]
# always required: dioxus itself, and its wasm-target transitive dep that
# needs the `js` feature explicitly activated for the web build
dioxus = { version = "0.7.9", features = ["fullstack", "router"] }
dioxus-html = "0.7.9"
getrandom = { version = "0.2.17", features = ["js"] }

# server-only deps, enabled by the `server` feature. these pull in the bots,
# native networking, and everything that can't compile for wasm32
munibot_core = { path = "../munibot_core", optional = true }
munibot_discord = { path = "../munibot_discord", optional = true }
munibot_twitch = { path = "../munibot_twitch", optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
axum = { version = "0.8.9", features = ["macros"], optional = true }
async-trait = { workspace = true, optional = true }
axum_session = { version = "0.20.1", optional = true }
axum_session_auth = { version = "0.20.0", optional = true }
axum_session_redispool = { version = "0.11.0", optional = true }
redis = { version = "1.3.0", optional = true }
redis_pool = { version = "0.10.0", optional = true }
diesel = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
  "dioxus/server",
  "dep:munibot_core",
  "dep:munibot_discord",
  "dep:munibot_twitch",
  "dep:clap",
  "dep:dotenvy",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:anyhow",
  "dep:axum",
  "dep:async-trait",
  "dep:axum_session",
  "dep:axum_session_auth",
  "dep:axum_session_redispool",
  "dep:redis",
  "dep:redis_pool",
  "dep:diesel",
]
