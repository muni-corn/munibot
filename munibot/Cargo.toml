[package]
name = "munibot"
description = "the universe's most lovable bot, personality included"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true


[dev-dependencies]
rand_chacha = "0.3"
tempfile = "3.27.0"

[dependencies]
# always required: dioxus itself (dx's platform detection looks for the
# binary crate enabling dioxus/web and dioxus/server directly), and its
# wasm-target transitive dep that needs the `wasm_js` feature explicitly
# activated for the web build
dioxus.workspace = true

# munibot_gui owns the App/Route/components/pages and the web/server
# entrypoints (including the axum/redis/session setup); munibot's main.rs
# just calls into it. its own web/server features are forwarded below
munibot_gui = { path = "../munibot_gui", default-features = false }

# server-only deps, enabled by the `server` feature. these pull in the bots,
# config/migrations, and everything that can't compile for wasm32
munibot_core = { path = "../munibot_core", optional = true }
munibot_discord = { path = "../munibot_discord", optional = true }
munibot_twitch = { path = "../munibot_twitch", optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[features]
default = ["web"]
web = ["dioxus/web", "munibot_gui/web"]
desktop = ["dioxus/desktop", "munibot_gui/desktop"]
server = [
  "dioxus/server",
  "munibot_gui/server",
  "dep:munibot_core",
  "dep:munibot_discord",
  "dep:munibot_twitch",
  "dep:clap",
  "dep:dotenvy",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:anyhow",
]
