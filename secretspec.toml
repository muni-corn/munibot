[project]
name = "munibot"
revision = "1.0"

[profiles.default]
DATABASE_URL = { description = "Database connection string", required = true }
DISCORD_APPLICATION_ID = { description = "Discord app ID (also used as the OAuth2 client ID)", required = true }
DISCORD_CLIENT_SECRET = { description = "Discord client secret", required = true }
DISCORD_PUBLIC_KEY = { description = "Discord public key", required = true }
DISCORD_TOKEN = { description = "Discord token", required = true }
TWITCH_CLIENT_ID = { description = "Twitch client ID", required = true }
TWITCH_CLIENT_SECRET = { description = "Twitch client secret", required = true }
TWITCH_TOKEN = { description = "Twitch token secret" }
VENTR_ALLOWLIST = { description = "Discord user IDs to allow ventriloquism for" }
REDIS_URL = { description = "Redis connection URL, backing gui login sessions", required = true }
MUNIBOT_BASE_URL = { description = "Public base URL the gui is served at, used to build OAuth2 redirect URIs (e.g. https://munibot.example.com)", required = true }
# every ai key is optional: munibot boots without them, and the chat page
# reports an unconfigured provider by name when someone tries to use it
ANTHROPIC_API_KEY = { description = "Anthropic API key, for chatting with anthropic: models", required = false }
OPENAI_API_KEY = { description = "OpenAI API key, for chatting with openai: models", required = false }
OPENROUTER_API_KEY = { description = "OpenRouter API key, for chatting with openrouter: models", required = false }
GITHUB_OAUTH_CLIENT_ID = { description = "GitHub OAuth App client ID, for \"sign in with github\"", required = false }
GITHUB_OAUTH_CLIENT_SECRET = { description = "GitHub OAuth App client secret, for \"sign in with github\"", required = false }
# email sign-in mails a magic link over smtp; unset SMTP_HOST disables it
SMTP_HOST = { description = "SMTP relay host, for email sign-in magic links", required = false }
SMTP_PORT = { description = "SMTP relay port (defaults to 587)", required = false }
SMTP_USERNAME = { description = "SMTP relay username", required = false }
SMTP_PASSWORD = { description = "SMTP relay password", required = false }
SMTP_FROM_ADDRESS = { description = "\"From\" address for email sign-in links (defaults to no-reply@<SMTP_HOST>)", required = false }

[profiles.development]
# development profile inherits all secrets from default profile
# only define secrets here that need different values or settings than default
DATABASE_URL = { default = "mysql://munibot:sillylittlepassword@localhost/munibot" }
REDIS_URL = { default = "redis://localhost:6379" }
MUNIBOT_BASE_URL = { default = "http://localhost:8080" }
