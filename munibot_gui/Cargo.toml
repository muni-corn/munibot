[package]
name = "munibot_gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "munibot's gui: components, routing, pages, and web/server entrypoints"
license.workspace = true

[dependencies]
# the composer base64-encodes an attachment's bytes client-side before ever
# reaching a server function, and decodes a pasted image's own JavaScript-side
# encoding straight back -- both happen in wasm, so this stays unconditional too
base64.workspace = true
# always required: dioxus itself (components/routing build for both
# targets), and the rpc boundary the pages call into
dioxus.workspace = true
dioxus-html.workspace = true
munibot_api = { path = "../munibot_api", default-features = false }
# markdown rendering for the chat page -- pure rust, compiles to wasm, so it
# stays unconditional rather than gated behind `server`
pulldown-cmark = { version = "0.9", default-features = false }
serde.workspace = true

# desktop-only, enabled by the `desktop` feature. pulls in native-tls and
# openssl-sys transitively, which can't compile for wasm32, so it must
# stay optional rather than an unconditional dependency
dioxus-desktop = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum_session = { workspace = true, optional = true }
axum_session_auth = { workspace = true, optional = true }
axum_session_redispool = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono.workspace = true
munibot_ai = { path = "../munibot_ai", optional = true }
# server-only deps, enabled by the `server` feature: the axum server that
# renders the gui, serves server functions, and backs login sessions. none
# of this can compile for wasm32
munibot_core = { path = "../munibot_core", optional = true }
munibot_github = { path = "../munibot_github", optional = true }
munibot_vcs = { path = "../munibot_vcs", optional = true }
octocrab = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
redis_pool = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
hmac.workspace = true
serde_json.workspace = true
sha2.workspace = true
tower = { workspace = true, features = ["util"] }
wiremock = "0.6.5"

[features]
default = []
desktop = ["dep:dioxus-desktop", "dioxus/desktop"]
server = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:axum",
  "dep:axum_session",
  "dep:axum_session_auth",
  "dep:axum_session_redispool",
  "dep:bytes",
  "dep:munibot_ai",
  "dep:munibot_core",
  "dep:munibot_github",
  "dep:munibot_vcs",
  "dep:octocrab",
  "dep:redis",
  "dep:redis_pool",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
  "dioxus/server",
  "munibot_api/server",
]
web = ["dioxus/web", "munibot_api/web"]
