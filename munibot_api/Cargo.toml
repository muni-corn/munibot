[package]
name = "munibot_api"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "server functions and wire types for munibot's gui"
license.workspace = true

[dependencies]
# always required: the server function macro, error types, and the wire
# dtos it serializes -- these must build for both wasm and native targets
dioxus.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

# server-only deps, enabled by the `server` feature: db access, the oauth
# client, the axum session/auth stack, and everything native-only that
# can't compile for wasm32
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum_session_auth = { workspace = true, optional = true }
axum_session_redispool = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
munibot_ai = { path = "../munibot_ai", optional = true }
munibot_core = { path = "../munibot_core", optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = []
server = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:axum",
  "dep:axum_session_auth",
  "dep:axum_session_redispool",
  "dep:chrono",
  "dep:diesel",
  "dep:futures",
  "dep:lettre",
  "dep:munibot_ai",
  "dep:munibot_core",
  "dep:reqwest",
  "dep:tokio",
  "dioxus/server",
  "dep:uuid",
  "dep:tokio-util",
  "dep:base64",
  "dep:sha2",
  "dep:lettre",
  "dep:rand",
]
web = ["dioxus/web"]
