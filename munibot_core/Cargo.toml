[package]
name = "munibot_core"
description = "platform-agnostic core library for munibot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
diesel.workspace = true
diesel-async.workspace = true
diesel_migrations.workspace = true
dotenvy.workspace = true
humantime.workspace = true
munibot_config = { path = "../munibot_config" }
tracing.workspace = true
once_cell.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
# derive isn't needed by munibot_core's own code (real providers derive
# their Config structs downstream, in munibot_discord), only by these
# tests, to build realistic fixtures with less boilerplate.
munibot_config = { path = "../munibot_config", features = ["derive"] }
tempfile = "3.27.0"
