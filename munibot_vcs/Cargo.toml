[package]
name = "munibot_vcs"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "forge-agnostic version control types and traits for munibot's autonomous pipeline"
license.workspace = true

# no forge-specific dependency belongs here, ever -- see munibot_github for
# the github app's own implementation of these traits.
[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
