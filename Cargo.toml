[workspace]
resolver = "3"
members = ["munibot", "munibot_core", "munibot_discord", "munibot_twitch"]

[workspace.package]
version = "0.3.3"
authors = ["municorn <municorn@musicaloft.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.4", features = ["derive"] }
decancer = "3.2.4"
diesel = { version = "2.3.6", features = ["chrono", "mysql", "uuid"] }
diesel-async = { version = "0.9", features = ["bb8", "mysql"] }
diesel_migrations = "2.3.1"
dotenvy = "0.15"
humantime = "2.1.0"
humantime-serde = "1.1.1"
num-format = "0.4"
once_cell = "1.18"
poise = { version = "0.6", features = ["cache"] }
rand = { version = "0.10.1", features = ["std_rng"] }
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.22", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "tracing-log",
] }
twitch_api = { version = "0.7", features = [
  "client",
  "eventsub",
  "helix",
  "hmac",
  "reqwest",
] }
twitch-irc = { version = "6.0", features = ["refreshing-token-native-tls"] }
twitch_oauth2 = "0.15"
url = "2.4"
