[workspace]
resolver = "3"
members = [
  "munibot",
  "munibot_ai",
  "munibot_api",
  "munibot_core",
  "munibot_discord",
  "munibot_gui",
  "munibot_toolagent",
  "munibot_twitch",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["municorn <municorn@musicaloft.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["macros"] }
axum_session = "0.20.1"
axum_session_auth = "0.20.0"
axum_session_redispool = "0.11.0"
backon = "1.6"
base64 = "0.23"
bollard = "0.21"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5.4", features = ["derive"] }
decancer = "3.2.4"
diesel = { version = "2.3.6", features = ["chrono", "mysql", "uuid"] }
diesel-async = { version = "0.9", features = ["mysql", "bb8"] }
diesel_migrations = "2.3.1"
dioxus = { version = "0.8.0-alpha.0", features = ["fullstack", "router"] }
dioxus-desktop = "0.8.0-alpha.0"
dioxus-html = "0.8.0-alpha.0"
dotenvy = "0.15"
futures = "0.3"
globset = "0.4"
http = "1.4"
html2text = "0.17"
humantime = "2.1.0"
humantime-serde = "1.1.1"
ignore = "0.4"
jsonschema = "0.49"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "tracing-log",
] }
num-format = "0.4"
once_cell = "1.18"
poise = { version = "0.6", features = ["cache"] }
rand = { version = "0.10.1", features = ["std_rng"] }
redis = "1.3.0"
redis_pool = "0.10.0"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rig-core = "0.41"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.22", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
twitch-irc = { version = "6.0", features = ["refreshing-token-native-tls"] }
twitch_api = { version = "0.7", features = [
  "client",
  "helix",
  "eventsub",
  "hmac",
  "reqwest",
] }
twitch_oauth2 = "0.15"
url = "2.4"
uuid = { version = "1.24.0", features = ["v4"] }
