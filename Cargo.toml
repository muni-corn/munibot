[workspace]
members = ["muni_bot", "muni_bot_gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["municorn <municorn@musicaloft.com>"]
description = "muni_bot, municorn's Twitch and Discord chatbot"
edition = "2021"
license-file = "LICENSE"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
